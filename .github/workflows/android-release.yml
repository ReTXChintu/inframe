# Builds the signed Android APK for every release, attaches it to the GitHub
# release, then ships it to the server: the APK lands in apps/web/public
# (served at /inframe.apk), the server pulls the code, rebuilds and restarts
# its pm2 process.
#
# Two ways to release:
#   • `npm run release:patch|minor|major` — bumps every app's version, pushes a
#     vX.Y.Z tag; this workflow then creates the GitHub release itself.
#   • Publish a release on GitHub (Releases → Draft a new release).
#
# Run it manually (Actions → Android release → Run workflow) to build a test
# APK as a downloadable artifact without deploying.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# Repository variables:
#   OIDC_ISSUER   (required for releases: the identity server the app signs in
#                  with, e.g. https://id-x.duckdns.org:50011)
#   API_BASE_URL  (optional: server the app talks to; default http://187.127.179.114:50010)

name: Android release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # create the release and attach the APK

# One run per version at a time (a release made in the GitHub UI can fire both triggers).
concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IS_RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    outputs:
      version: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.code }}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # HTTPS on in-frame.duckdns.org since the move to one sign-in; the old
      # API_BASE_URL variable may still say plain http, so it isn't read.
      API_BASE_URL: https://in-frame.duckdns.org:50010
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER || 'https://pass-port.duckdns.org:50011' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Version
        id: version
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # Build numbers only go up: every workflow run gets a new one.
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Release signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Refuse unsigned releases
        if: env.IS_RELEASE == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a release APK must be signed with the InFrame key so phones can update it."
          exit 1

      - name: Refuse releases that can't sign in
        if: env.IS_RELEASE == 'true' && env.OIDC_ISSUER == ''
        run: |
          echo "::error::The OIDC_ISSUER repository variable is not set — the app signs in through the identity server and can't without it."
          exit 1

      - name: Build APK
        run: |
          # Phones only (ARM); skipping x86_64 emulator code keeps the APK much smaller.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=OIDC_ISSUER="$OIDC_ISSUER" \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/inframe-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: inframe-apk
          path: inframe-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / update the GitHub release
        if: env.IS_RELEASE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag (npm run release:*) has no release yet: create it with generated notes.
          # Releases created by GITHUB_TOKEN don't trigger this workflow again.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "InFrame $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "inframe-${{ steps.version.outputs.name }}.apk" --clobber

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inframe-apk

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload APK, pull, rebuild, restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "release ${{ needs.build.outputs.version }} ${{ needs.build.outputs.build }}" \
            < "inframe-${{ needs.build.outputs.version }}.apk"
