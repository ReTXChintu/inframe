name: inframe
description: "InFrame: shared event albums that find every photo you're in."
publish_to: 'none'
version: 0.2.7+9
environment:
  sdk: ^3.13.2

dependencies:
  background_downloader: ^9.6.4
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  gal: ^2.3.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # IBM Plex, bundled so the app works offline (SIL Open Font License 1.1;
  # the licence text ships beside the files in assets/fonts/OFL.txt).
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# `dart run flutter_launcher_icons` regenerates the launcher icons from these.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#17161B"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21
